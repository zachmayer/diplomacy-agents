[project]
name = "diplomacy-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "diplomacy>=1.1.2",
    # Slim plus the providers MODEL_UNIVERSE names; add an extra to try another provider.
    "pydantic-ai-slim[anthropic,google,openai]>=2.66.0",
    "click>=8.1.7",
    "drawsvg>=2.4.0",
    "tokonomics>=0.5.1",
    "pandas>=2.3.1",
    "token-count>=0.2.1",
]

[tool.uv]
# tokonomics on Python 3.12 tops out at 0.5.1, whose anyenv imports hishel._serializers,
# gone in hishel 1.0. tokonomics swallows the ImportError and prices every run at $0.
constraint-dependencies = ["hishel<1"]

[dependency-groups]
dev = [
    "pandas-stubs>=2.3.0.250703",
    "pre-commit>=4.2.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.0",
    "ty>=0.0.98",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "F",  # pycodestyle & pyflakes basics
  "I",         # Import sorting (isort)
  "N",         # PEP 8 naming
  "B",         # Bugbear – common bugs
  "UP",        # PyUpgrade – modernises code
  "SIM",       # Simplify code
  "C4",        # Comprehensions etc.
  "D",         # Docstrings
  "ANN",       # Type annotations
  "T",         # Print statements
  "ARG",       # Unused arguments
  "SLF",       # Private member access
  "W",         # Newline at EOF (W292)
]

# Ignore rules that clash with formatter or are overly strict
ignore = [
  "E501",   # Line length handled by formatter
  "COM812", # Trailing commas – Ruff formatter handles
  "D203",   # Conflicts with D211
  "D212",   # Conflicts with D213
]

[tool.ruff.lint.isort]
combine-as-imports = true
case-sensitive = true
known-third-party = ["diplomacy", "pydantic", "pydantic_ai", "click"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SLF001"]  # tests reach into private helpers on purpose
"diplomacy_agents/agent.py" = ["ANN001"]  # decorator params lack annotations

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["typings"]  # our stubs, which win over the installed untyped drawsvg

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.terminal]
error-on-warning = true

# Off by default in ty. Named here, not `all`, so coverage changes only when this file does.
[tool.ty.rules]
blanket-ignore-comment = "error"
disjoint-cast = "error"
division-by-zero = "error"
dynamic-function-decorator-return = "error"
invalid-legacy-positional-parameter = "error"
mismatched-sentinel-name = "error"
missing-override-decorator = "error"
missing-type-argument = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
redundant-condition-strict = "error"
truthiness-test-of-none-union = "error"
unsound-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"
unsupported-dynamic-base = "error"
# Skipped: missing-direct-dependency, a preview rule.

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    'ignore:datetime\.datetime\.utcfromtimestamp\(\) is deprecated.*:DeprecationWarning',
]
log_cli = true
log_cli_level = "INFO"
